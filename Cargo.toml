[package]
name = "dcerpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Pure-Rust DCE/RPC (MS-RPCE): hand-rolled NDR marshaling, PDUs, NTLMSSP sign+seal (packet privacy), TCP + SMB named-pipe transports, EPM, and SAMR/LSAT/DRSUAPI/SVCCTL clients — no FFI."
license = "MIT"
repository = "https://github.com/icedracon/dcerpc"
documentation = "https://docs.rs/dcerpc"
readme = "README.md"
keywords = ["dcerpc", "msrpc", "ndr", "samr", "windows"]
categories = ["network-programming", "parser-implementations", "os::windows-apis"]

[dependencies]
ntlmssp = "0.1"
smb2-client = "0.1"
windows-sddl = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time"] }
tracing = "0.1"
md-5 = "0.10"
des = "0.8"
hex = "0.4"
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }

[badges]
maintenance = { status = "actively-developed" }
