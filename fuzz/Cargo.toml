[package]
name = "dcerpc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.dcerpc]
path = ".."

# One fuzz target per top-level reply decoder. See `fuzz/README.md`.

[[bin]]
name = "srvsvc_decode"
path = "fuzz_targets/srvsvc_decode.rs"
test = false
doc = false
bench = false

